name: CI

on:
  push:
    branches: [main]
  pull_request:

# action は tag ではなく commit SHA で固定する。tag は付け替えられるため、
# 固定しないと third-party action の乗っ取りがそのまま CI 実行権限になる
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # mise.toml の pin をそのまま使う。ここで node/pnpm のバージョンを
      # 書き直すと、ローカルと CI で暗黙に食い違う
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.7.7

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # dist が壊れていないことまで見る。overlay は d.ts の生成が
      # tsconfig の rootDir 設定に依存していて壊れやすい
      - run: pnpm build
